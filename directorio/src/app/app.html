<h1>{{ title() }} ({{ totalUsers() }} usuarios)</h1>

<app-controls (orderByIdClick)="orderById()" (orderByNameClick)="orderByName()" (reverse)="reverse()"></app-controls>

<div class="user-list">
  @for (user of users(); track user.id) {
    
    <app-user-card 
      [user]="user" 
      (delete)="removeUser($event)">
    </app-user-card>

  } @empty {
    
    <div class="mensaje-vacio">
      No hay usuarios en el directorio. El directorio está vacío.
    </div>

  }
</div>
